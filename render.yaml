# Blueprint de Render: New + → Blueprint → elige este repositorio → Apply.
# Lo único que te pide es AUTH_TOKEN: la contraseña con la que entrarás al dashboard.
services:
  - type: web
    name: webadn
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: AUTH_TOKEN
        sync: false
